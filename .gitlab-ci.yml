stages:
 - test

.install-deps-jessie: &install-deps-jessie
  image: debian:jessie
  before_script:
  - apt-get -qq update -y
  - apt-get -qq install -y build-essential python3-pip python3-virtualenv python3-dev wget ca-certificates gnupg2
  - wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add -
  - echo "deb http://apt.postgresql.org/pub/repos/apt/ jessie-pgdg main" > /etc/apt/sources.list.d/pgdg.list
  - apt-get -qq update -y
  - apt-get -qq install -y postgresql-client-10 libpq5 libpq-dev

.install-deps-stretch: &install-deps-stretch
  image: debian:stretch
  before_script:
  - apt-get -qq update -y
  - apt-get -qq install -y build-essential python3-pip python3-virtualenv python3-dev wget ca-certificates gnupg2
  - wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add -
  - echo "deb http://apt.postgresql.org/pub/repos/apt/ stretch-pgdg main" > /etc/apt/sources.list.d/pgdg.list
  - apt-get -qq update -y
  - apt-get -qq install -y postgresql-client-10 libpq5 libpq-dev

.install-deps-buster: &install-deps-buster
  image: debian:buster
  before_script:
  - apt-get -qq update -y
  - apt-get -qq install -y postgresql-client-11 libpq5 libpq-dev
  - apt-get -qq install -y build-essential python3-pip python3-virtualenv python3-dev

.using-pg10: &using-pg10
  services:
  - postgres:10

.using-pg11: &using-pg11
  services:
  - postgres:11

.run-tests: &run-tests
  script:
  - mkdir -p $XDG_CACHE_HOME
  - python3 -m virtualenv --python=/usr/bin/python3 .venv
  - .venv/bin/pip install -U pip wheel setuptools
  - .venv/bin/pip install -e .
  - PGUSER=postgres PGDATABASE=postgres PGHOST=postgres ./.setup-database.sh
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic upgrade head
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic downgrade base
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic upgrade head
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic downgrade base
  - .venv/bin/nosetests --with-coverage --cover-package=kneipy_core --cover-branches --cover-html -dv
  artifacts:
    when: on_success
    paths:
      - cover/
    name: "${CI_BUILD_REF_SLUG}_${CI_BUILD_NAME}_${CI_BUILD_REF}"
    expire_in: 2 weeks
  variables:
    DATABASE_URI_TESTS: postgresql://kneipy-dev:kneipy-dev@postgres/kneipy-tests
    XDG_CACHE_HOME: ".cache"
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache

test-jessie-pg10:
  <<: *install-deps-jessie
  <<: *run-tests
  <<: *using-pg10
  stage: test

test-stretch-pg10:
  <<: *install-deps-stretch
  <<: *run-tests
  <<: *using-pg10
  stage: test

test-buster-pg10:
  <<: *install-deps-buster
  <<: *run-tests
  <<: *using-pg10
  stage: test

test-buster-pg11:
  <<: *install-deps-buster
  <<: *run-tests
  <<: *using-pg11
  stage: test
