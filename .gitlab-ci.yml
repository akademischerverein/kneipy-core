stages:
 - test

.install-deps-bullseye: &install-deps-bullseye
  image: debian:trixie
  before_script:
  # Configure apt caching
  - echo $CI_PROJECT_DIR
  - export APT_DIR=$CI_PROJECT_DIR/.apt && export APT_STATE_LISTS=$APT_DIR/lists && export APT_CACHE_ARCHIVES=$APT_DIR/archives
  - printf "dir::state::lists    ${APT_STATE_LISTS};\ndir::cache::archives    ${APT_CACHE_ARCHIVES};\n" > /etc/apt/apt.conf
  - mkdir -p "${APT_STATE_LISTS}/partial" && mkdir -p "${APT_CACHE_ARCHIVES}/partial"
  # Install dependencies
  - apt-get -qq update -y
  - apt-get -qq install -y postgresql-client-13 libpq5 libpq-dev
  - apt-get -qq install -y build-essential python3-pip python3-virtualenv python3-dev

.install-deps-buster: &install-deps-buster
  image: debian:trixie
  before_script:
  # Configure apt caching
  - echo $CI_PROJECT_DIR
  - export APT_DIR=$CI_PROJECT_DIR/.apt && export APT_STATE_LISTS=$APT_DIR/lists && export APT_CACHE_ARCHIVES=$APT_DIR/archives
  - printf "dir::state::lists    ${APT_STATE_LISTS};\ndir::cache::archives    ${APT_CACHE_ARCHIVES};\n" > /etc/apt/apt.conf
  - mkdir -p "${APT_STATE_LISTS}/partial" && mkdir -p "${APT_CACHE_ARCHIVES}/partial"
  # Install dependencies
  - apt-get -qq update -y
  - apt-get -qq install -y postgresql-client-11 libpq5 libpq-dev
  - apt-get -qq install -y build-essential python3-pip python3-virtualenv python3-dev

.using-pg10: &using-pg10
  services:
  - postgres:10

.using-pg11: &using-pg11
  services:
  - postgres:11

.using-pg12: &using-pg12
  services:
  - postgres:12

.using-pg13: &using-pg13
  services:
  - postgres:13

.using-pg14: &using-pg14
  services:
  - postgres:14

.using-pg15: &using-pg15
  services:
  - postgres:15

.run-tests: &run-tests
  script:
  - mkdir -p $XDG_CACHE_HOME
  - python3 -m virtualenv --python=/usr/bin/python3 .venv
  - .venv/bin/pip install -U pip wheel setuptools
  - .venv/bin/pip install -e .
  - PGUSER=postgres PGDATABASE=postgres PGHOST=postgres ./.setup-database.sh
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic upgrade head
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic downgrade base
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic upgrade head
  - DATABASE_URI=$DATABASE_URI_TESTS .venv/bin/alembic downgrade base
  - .venv/bin/nosetests --with-coverage --cover-package=kneipy_core --cover-branches --cover-html -dv
  artifacts:
    when: on_success
    paths:
      - cover/
    name: "${CI_BUILD_REF_SLUG}_${CI_BUILD_NAME}_${CI_BUILD_REF}"
    expire_in: 2 weeks
  variables:
    DATABASE_URI_TESTS: postgresql://kneipy-dev:kneipy-dev@postgres/kneipy-tests
    XDG_CACHE_HOME: ".cache"
    POSTGRES_HOST_AUTH_METHOD: "trust"
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache
      - .apt

test-buster-pg10:
  <<: *install-deps-buster
  <<: *run-tests
  <<: *using-pg10
  stage: test

test-buster-pg11:
  <<: *install-deps-buster
  <<: *run-tests
  <<: *using-pg11
